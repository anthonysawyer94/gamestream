services:
  web:
    build: .
    container_name: gamestream_web
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - /opt/gamestream/staticfiles:/app/staticfiles
    # Using Gunicorn instead of runserver for stability
    command: gunicorn --bind 0.0.0.0:8000 --workers 3 config.wsgi:application