name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Decode SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2_key.pem
          chmod 600 ec2_key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2_key.pem ${{ secrets.EC2_USERNAME }}@${{ secrets.EC2_HOST }} << 'EOF'
            set -e # Exit immediately if a command exits with a non-zero status
            cd /opt/gamestream

            # 1. Update the code
            sudo git fetch origin main
            sudo git reset --hard origin/main

            # 2. Rebuild and Restart Containers
            sudo docker-compose down
            sudo docker-compose up -d --build
            
            # Wait for container to be fully up before running commands
            sleep 5 

            # 3. Fix permissions and collectstatic
            # Using -u root to ensure we have write access inside the container
            sudo docker-compose exec -u root -T web python3 manage.py migrate --noinput
            sudo docker-compose exec -u root -T web python3 manage.py collectstatic --noinput --clear

            # 4. Sync host permissions so Apache can read the files
            sudo chown -R ubuntu:www-data /opt/gamestream/staticfiles
            sudo chmod -R 755 /opt/gamestream/staticfiles

            # 5. Refresh Apache
            sudo systemctl restart apache2

            # 6. Set up daily cron job (The "fetch_schedule" logic)
            # Using 'which docker-compose' ensures we use the correct system path
            DOCKER_COMPOSE_PATH=$(which docker-compose)
            (crontab -l 2>/dev/null | grep -v "fetch_schedule"; echo "0 6 * * * cd /opt/gamestream && $DOCKER_COMPOSE_PATH exec -T web python manage.py fetch_schedule --days 8 >> /var/log/fetch_schedule.log 2>&1") | crontab -

            # 7. Clean up games without streaming services
            sudo docker-compose exec -T web python manage.py shell -c "from schedules.models import Game; Game.objects.filter(streaming_service__isnull=True).delete()"
            
            # 8. Final Image Prune
            sudo docker image prune -f
          EOF

      - name: Cleanup SSH key
        if: always()
        run: rm -f ec2_key.pem
